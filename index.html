                            ${company.business} ${company.pr} ${company.eventDetails} ${company.workplace}
                        `.toLowerCase();
                        
                        const isAllMatched = terms.every(term => searchableText.includes(term));
                        if (!isAllMatched) return false;
                    }

                    return true;
                });
            }, [conditions, showBookmarksOnly, bookmarks]);

            return (
                <div className="min-h-screen bg-gray-50 text-gray-800 font-sans pb-10">
                    <header className="bg-emerald-700 text-white shadow-md">
                        <div className="max-w-6xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex items-center justify-between">
                            <div>
                                <h1 className="text-xl font-bold">学内合同企業研究会2026 企業探しナビゲーター</h1>
                                <p className="text-xs text-emerald-100 mt-1">希望の条件から、あなたにピッタリの企業を見つけよう！</p>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row gap-8">
                        {/* 左側: 検索フォーム */}
                        <aside className="w-full md:w-1/3 lg:w-1/4 flex-shrink-0">
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 sticky top-6">
                                <div className="flex items-center gap-2 mb-4 border-b pb-2 border-gray-100">
                                    <IconSearch />
                                    <h2 className="text-lg font-semibold text-gray-700">条件で探す</h2>
                                </div>

                                <div className="space-y-4">
                                    {/* 気になる企業のみ表示スイッチ */}
                                    <div className="bg-amber-50 p-3 rounded-lg border border-amber-100 mb-2">
                                        <div className="flex items-center justify-between cursor-pointer" onClick={() => setShowBookmarksOnly(!showBookmarksOnly)}>
                                            <span className="text-sm font-bold text-amber-800 flex items-center gap-1">
                                                <span className="text-amber-500">★</span> 気になる企業をチェック
                                            </span>
                                            <div className="relative inline-block w-12 mr-2 align-middle select-none">
                                                <input type="checkbox" checked={showBookmarksOnly} readOnly className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                                <label className="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-600 mb-1">参加日時</label>
                                        <select name="datetime" value={conditions.datetime} onChange={handleChange} className="w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 text-sm p-2 border" disabled={showBookmarksOnly}>
                                            {datetimeOptions.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-600 mb-1">学部・学科・専攻</label>
                                        <select name="faculty" value={conditions.faculty} onChange={handleChange} className="w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 text-sm p-2 border" disabled={showBookmarksOnly}>
                                            {facultyOptions.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-600 mb-1">希望業種</label>
                                        <select name="industry" value={conditions.industry} onChange={handleChange} className="w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 text-sm p-2 border" disabled={showBookmarksOnly}>
                                            {industryOptions.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-600 mb-1">希望職種</label>
                                        <input type="text" name="occupation" value={conditions.occupation} onChange={handleChange} placeholder="例: 営業、設計、製造" className="w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 text-sm p-2 border" disabled={showBookmarksOnly} />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-600 mb-1">希望勤務地</label>
                                        <input type="text" name="workplace" value={conditions.workplace} onChange={handleChange} placeholder="例: 福井県、東京" className="w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 text-sm p-2 border" disabled={showBookmarksOnly} />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-600 mb-1">フリーワード</label>
                                        <input type="text" name="freeword" value={conditions.freeword} onChange={handleChange} placeholder="企業名、事業内容など" className="w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 text-sm p-2 border" disabled={showBookmarksOnly} />
                                    </div>
                                    
                                    <div className="pt-2">
                                        <button onClick={() => setConditions({datetime: "指定しない", faculty: "指定しない", industry: "指定しない", occupation: "", workplace: "", freeword: ""})} className="w-full py-2 px-4 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500" disabled={showBookmarksOnly}>
                                            条件をクリア
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </aside>

                        {/* 右側: 結果表示 */}
                        <div className="w-full md:w-2/3 lg:w-3/4">
                            <div className="mb-4 flex items-center justify-between">
                                <h2 className="text-xl font-bold text-gray-800">
                                    {showBookmarksOnly ? "気になる企業: " : "該当企業: "}
                                    <span className="text-emerald-600">{filteredCompanies.length}</span> 社
                                </h2>
                            </div>

                            {filteredCompanies.length === 0 ? (
                                <div className="bg-white p-8 text-center rounded-xl border border-gray-100 shadow-sm">
                                    <p className="text-gray-500">
                                        {showBookmarksOnly 
                                            ? "気になる企業がまだ登録されていません。\n気になる企業の★マークをクリックして登録してください。"
                                            : "条件に一致する企業が見つかりませんでした。\n検索条件を変更してみてください。"}
                                    </p>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {filteredCompanies.map(company => {
                                        const isBookmarked = bookmarks.includes(company.id);
                                        const hasMemo = memos[company.id] && memos[company.id].trim() !== "";

                                        return (
                                        <div key={company.id} className={`bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-md transition-shadow ${isBookmarked ? 'border-amber-300' : 'border-gray-200'}`}>
                                            <div className="p-5 border-b border-gray-100">
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="pr-4">
                                                        <span className="inline-block px-2 py-1 bg-emerald-100 text-emerald-800 text-xs font-semibold rounded mb-2">
                                                            ブース: {company.booth}
                                                        </span>
                                                        <h3 className="text-xl font-bold text-gray-900">{company.name}</h3>
                                                    </div>
                                                    <div className="text-right flex-shrink-0 flex flex-col items-end gap-2">
                                                        <div className="flex items-center gap-2">
                                                            {/* メモありアイコン */}
                                                            {hasMemo && (
                                                                <span className="inline-flex items-center justify-center p-1.5 bg-yellow-100 text-yellow-700 rounded-full" title="メモが書かれています">
                                                                    <IconPen />
                                                                </span>
                                                            )}
                                                            {/* お気に入りボタン */}
                                                            <button 
                                                                onClick={() => toggleBookmark(company.id)}
                                                                className={`p-1.5 rounded-full transition-colors ${isBookmarked ? 'bg-amber-50 text-amber-500 hover:bg-amber-100' : 'text-gray-400 hover:bg-gray-100 hover:text-gray-600'}`}
                                                                title={isBookmarked ? "気になるを解除" : "気になるに登録"}
                                                            >
                                                                {isBookmarked ? <IconStarFilled /> : <IconStarEmpty />}
                                                            </button>
                                                        </div>
                                                        
                                                        <span className="inline-flex items-center text-xs font-semibold text-gray-600 bg-gray-100 px-2 py-1 rounded">
                                                            <IconClock /> <span className="ml-1">{company.datetime}</span>
                                                        </span>
                                                    </div>
                                                </div>
                                                
                                                <p className="text-sm text-gray-600 line-clamp-3 mt-2">{company.pr}</p>
                                                
                                                <div className="flex flex-wrap gap-3 mt-3 text-sm text-gray-600">
                                                    <span className="flex items-center gap-1"><IconBuilding /> {company.industryLarge}</span>
                                                    <span className="flex items-center gap-1"><IconMapPin /> 本社: {company.hq}</span>
                                                </div>
                                            </div>

                                            <div 
                                                className="bg-gray-50 px-5 py-3 flex justify-center items-center cursor-pointer hover:bg-gray-100 transition-colors"
                                                onClick={() => setExpandedId(expandedId === company.id ? null : company.id)}
                                            >
                                                <span className="text-sm font-medium text-emerald-600">
                                                    {expandedId === company.id ? "詳細を閉じる ▲" : "企業プロフィール・メモを開く ▼"}
                                                </span>
                                            </div>

                                            {expandedId === company.id && (
                                                <div className="p-5 bg-white text-sm border-t border-gray-100">
                                                    <dl className="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-4">
                                                        
                                                        <div className="col-span-1 md:col-span-2">
                                                            <dt className="font-semibold text-gray-500 mb-1 border-b pb-1">事業内容</dt>
                                                            <dd className="text-gray-800">{company.business}</dd>
                                                        </div>

                                                        <div className="col-span-1 md:col-span-2">
                                                            <dt className="font-semibold text-gray-500 mb-1 border-b pb-1">採用対象学部</dt>
                                                            <dd className="text-gray-800">{company.targetFaculties}</dd>
                                                        </div>

                                                        <div>
                                                            <dt className="font-semibold text-gray-500 mb-1 border-b pb-1">勤務地</dt>
                                                            <dd className="text-gray-800">{company.workplace}</dd>
                                                        </div>

                                                        <div>
                                                            <dt className="font-semibold text-gray-500 mb-1 border-b pb-1">企業データ</dt>
                                                            <dd className="text-gray-800">
                                                                設立: {company.established} <br/>
                                                                資本金: {company.capital} <br/>
                                                                従業員数: {company.employees} <br/>
                                                                上場: {company.listed}
                                                            </dd>
                                                        </div>

                                                        <div>
                                                            <dt className="font-semibold text-gray-500 mb-1 border-b pb-1">福井大学とのつながり</dt>
                                                            <dd className="text-gray-800">
                                                                OB・OG在籍数: {company.alumniCount}<br/>
                                                                ブースへのOB・OG参加: {company.obog}<br/>
                                                                留学生採用: {company.foreignStudents}
                                                            </dd>
                                                        </div>

                                                        <div className="col-span-1 md:col-span-2 bg-emerald-50 p-4 rounded mt-2 border border-emerald-100">
                                                            <dt className="font-semibold text-emerald-800 mb-2">自社イベント情報</dt>
                                                            <dd className="text-emerald-900 space-y-1">
                                                                <p><strong>【内容】</strong> {company.eventDetails}</p>
                                                                <p><strong>【対象】</strong> {company.eventTargets}</p>
                                                                <p><strong>【応募方法】</strong> {company.applyMethods.join("、 ")}</p>
                                                            </dd>
                                                        </div>
                                                        
                                                        {/* メモ機能 */}
                                                        <div className="col-span-1 md:col-span-2 bg-yellow-50 p-4 rounded mt-2 border border-yellow-200">
                                                            <dt className="font-semibold text-yellow-800 mb-2 flex items-center gap-1">
                                                                <IconPen /> 気になったことメモ
                                                            </dt>
                                                            <dd>
                                                                <textarea
                                                                    className="w-full rounded-md border-yellow-300 shadow-sm p-3 text-sm focus:border-yellow-500 focus:ring-yellow-500 bg-white"
                                                                    rows="3"
                                                                    placeholder="説明会で聞いたこと、印象に残ったことなどを自由にメモしましょう。"
                                                                    defaultValue={memos[company.id] || ""}
                                                                    onBlur={(e) => saveMemo(company.id, e.target.value)}
                                                                ></textarea>
                                                                <p className="text-xs text-yellow-600 mt-1 flex items-center gap-1">
                                                                    <span>💡</span> 枠外をクリックしたり、詳細を閉じると自動的にブラウザに保存されます。（※ブラウザの履歴を消去するとメモも消えるのでご注意ください）
                                                                </p>
                                                            </dd>
                                                        </div>

                                                        <div className="col-span-1 md:col-span-2 mt-2 text-right">
                                                            <a href={company.url} target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-emerald-600 hover:bg-emerald-700 shadow-sm">
                                                                採用ホームページへ
                                                            </a>
                                                        </div>
                                                    </dl>
                                                </div>
                                            )}
                                        </div>
                                    )})}
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
